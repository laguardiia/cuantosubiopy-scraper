name: Supabase keepalive

on:
  schedule:
    - cron: "0 12 * * 1,4"   # lunes y jueves
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta liviana a Postgres vía REST
        run: |
          curl -fsS \
            "${{ secrets.SUPABASE_URL }}/rest/v1/supermercados?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"