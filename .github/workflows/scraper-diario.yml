name: Scraper diario

on:
  schedule:
    # Corre todos los lunes a las 09:00 UTC (~05:00-06:00 en Paraguay
    # según horario de verano). Semanal alcanza y sobra para ver
    # tendencias de precio -- no hace falta granularidad diaria.
    - cron: "0 9 * * 1"
  workflow_dispatch: {}  # permite correrlo a mano desde la pestaña "Actions" de GitHub, para probar

jobs:
  scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr el scraper diario
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python cron_diario.py
